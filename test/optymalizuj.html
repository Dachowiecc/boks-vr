<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<title>Optymalizacja modeli</title>
<style>body{font:14px system-ui;background:#111;color:#eee;padding:16px}pre{white-space:pre-wrap}</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/",
  "meshoptimizer": "https://cdn.jsdelivr.net/npm/meshoptimizer@0.21.0/+esm"
} }
</script>
</head>
<body>
<h1>Optymalizacja modeli pod Questa 2</h1>
<pre id="log"></pre>
<script type="module">
// Narzędzie jednorazowe: surowe GLB z Meshy (assets/models/*.raw.glb) -> lekkie GLB dla gry.
// Tekstury zmniejszone do 1024 px (JPEG), siatki przedmiotów uproszczone, szkielet i animacje bez zmian.
// Wynik wysyłany POST-em do test/odbior.py (port 8147), który zapisuje plik na dysk.
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { GLTFExporter } from 'three/addons/exporters/GLTFExporter.js';
import { MeshoptSimplifier } from 'meshoptimizer';
import { mergeVertices } from 'three/addons/utils/BufferGeometryUtils.js';

const log = (...a) => { document.getElementById('log').textContent += a.join(' ') + '\n'; };
const TEX = 1024;

async function shrinkTexture(tex) {
  if (!tex || !tex.image) return tex;
  const img = tex.image, s = Math.min(1, TEX / Math.max(img.width, img.height));
  const c = document.createElement('canvas'); c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
  c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
  const blob = await new Promise(r => c.toBlob(r, 'image/jpeg', 0.86));
  const bmp = await createImageBitmap(blob);
  const t = new THREE.Texture(bmp);
  t.flipY = tex.flipY; t.colorSpace = tex.colorSpace; t.wrapS = tex.wrapS; t.wrapT = tex.wrapT; t.needsUpdate = true;
  t.userData.mimeType = 'image/jpeg';
  return t;
}

function simplify(geo, targetTris) {
  if (!geo.index) geo = mergeVertices(geo);
  const idx = geo.index.array, pos = geo.attributes.position.array;
  const target = Math.min(idx.length, targetTris * 3);
  const [out] = MeshoptSimplifier.simplify(new Uint32Array(idx), new Float32Array(pos), 3, target - (target % 3), 0.02, ['LockBorder']);
  // zostaw tylko wierzchołki użyte przez nowe trójkąty
  const map = new Int32Array(pos.length / 3).fill(-1); let n = 0;
  const idx2 = new Uint32Array(out.length);
  for (let i = 0; i < out.length; i++) { const v = out[i]; if (map[v] < 0) map[v] = n++; idx2[i] = map[v]; }
  const g = new THREE.BufferGeometry();
  for (const [key, attr] of Object.entries(geo.attributes)) {
    const k = attr.itemSize, src = attr.array, dst = new src.constructor(n * k);
    for (let v = 0; v < map.length; v++) if (map[v] >= 0) for (let c = 0; c < k; c++) dst[map[v] * k + c] = src[v * k + c];
    g.setAttribute(key, new THREE.BufferAttribute(dst, k, attr.normalized));
  }
  g.setIndex(new THREE.BufferAttribute(idx2, 1));
  return g;
}

async function process(name, { targetTris = 0 } = {}) {
  const t0 = performance.now();
  const gltf = await new GLTFLoader().loadAsync(`/assets/models/${name}.raw.glb`);
  let before = 0, after = 0;
  const jobs = [];
  gltf.scene.traverse(o => {
    if (!o.isMesh) return;
    before += (o.geometry.index ? o.geometry.index.count : o.geometry.attributes.position.count) / 3;
    if (targetTris && !o.isSkinnedMesh) o.geometry = simplify(o.geometry, targetTris);
    after += (o.geometry.index ? o.geometry.index.count : o.geometry.attributes.position.count) / 3;
    const mats = Array.isArray(o.material) ? o.material : [o.material];
    for (const m of mats) for (const k of ['map', 'normalMap', 'roughnessMap', 'metalnessMap', 'emissiveMap', 'aoMap']) {
      if (m[k]) jobs.push(shrinkTexture(m[k]).then(t => { m[k] = t; }));
    }
  });
  await Promise.all(jobs);
  const glb = await new GLTFExporter().parseAsync(gltf.scene, { binary: true, animations: gltf.animations, onlyVisible: false });
  const res = await fetch(`http://127.0.0.1:8147/${name}.glb?dir=models`, { method: 'POST', body: glb });
  log(`${name}: trójkąty ${Math.round(before)} -> ${Math.round(after)}, animacje ${gltf.animations.length}, plik ${(glb.byteLength / 1e6).toFixed(1)} MB, ${Math.round(performance.now() - t0)} ms, zapis ${await res.text()}`);
}

await MeshoptSimplifier.ready;
window.__run = async (list) => { for (const [n, o] of list) { try { await process(n, o); } catch (e) { log(n, 'BŁĄD', e.message); } } return document.getElementById('log').textContent; };
log('gotowe, wywołaj __run([...])');
</script>
</body>
</html>
